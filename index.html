<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0f4c45">

<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img,svg{max-width:100%}
[hidden]{display:none!important}

/* Layout: one portrait SVG pamphlet as the hero, an inquiry builder beneath it */
:root{
  --page:#eef3f1; --ink:#12302b; --muted:#4d6661; --card:#ffffff; --line:#cfdcd8;
  --teal:#0f4c45; --saffron:#f2b632; --sea:#1d8a7a;
  --display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0c1816;--ink:#e3eeeb;--muted:#9fb5b0;--card:#132522;--line:#24403b;color-scheme:dark}}
:root[data-theme="dark"]{--page:#0c1816;--ink:#e3eeeb;--muted:#9fb5b0;--card:#132522;--line:#24403b;color-scheme:dark}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:20px}
.poster{width:100%;height:auto;display:block;border-radius:14px;box-shadow:0 10px 30px rgba(10,40,35,.25)}
.poster text{font-family:var(--body)}
.poster .disp{font-family:var(--display)}
.cred{cursor:pointer}
.cred rect.bg{transition:fill .2s}
.cred:hover rect.bg,.cred:focus rect.bg,.cred.on rect.bg{fill:#185e55}
.cred.gold:hover rect.bg,.cred.gold:focus rect.bg{fill:#ffcd52}
.cred:focus{outline:none}
.cred:focus-visible rect.bg{stroke:#f2b632;stroke-width:2}
.hint{font-size:13px;color:var(--muted);text-align:center;margin:-8px 0 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.panel h2{font-family:var(--display);font-size:20px;margin:0;text-wrap:balance}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px var(--body);padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
input{width:100%;box-sizing:border-box;font:15px var(--body);padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.msg{white-space:pre-wrap;font-size:14px;background:var(--page);border-radius:10px;padding:12px;border:1px dashed var(--line);margin:0}
.btn{font:700 15px var(--body);padding:12px;border-radius:10px;border:0;background:var(--saffron);color:#12302b;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(6,25,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding-inline:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-card{background:var(--card);color:var(--ink);width:100%;max-width:440px;border-radius:18px 18px 0 0;padding:20px 20px 28px;display:grid;gap:12px;border-top:5px solid var(--saffron);animation:up .25s ease-out;max-height:85vh;overflow-y:auto}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head h2{font-family:var(--display);font-size:21px;margin:0;flex:1;min-width:0;text-wrap:balance}
.sheet-ico{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--teal);display:grid;place-items:center;flex:none}
.sheet-x{border:0;background:var(--page);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:15px;cursor:pointer;flex:none}
.sheet-x:focus-visible{outline:2px solid var(--saffron)}
#sh-body{margin:0}
#sh-list{margin:0;padding-left:20px;display:grid;gap:6px}
#sh-list li::marker{color:var(--sea)}
.wa{display:block;text-align:center;text-decoration:none}
.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.contact p{margin:0;user-select:text;overflow-wrap:anywhere}
.ok{font-size:13px;color:var(--sea);min-height:1em;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
</style>
</head>
<body>
<div class="wrap">
<svg class="poster" viewBox="0 0 400 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pt">
  <title id="pt">Pamflet les privat ke rumah bersama St. Mutmainah, S.Pd., M.Pd.</title>
  <defs>
    <pattern id="weave" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 L10 0 L20 10 L10 20 Z" fill="none" stroke="#f2b632" stroke-width="1" opacity=".35"/>
      <circle cx="10" cy="10" r="1.6" fill="#f2b632" opacity=".5"/>
    </pattern>
  </defs>
  <rect width="400" height="744" fill="#0f4c45"/>
  <!-- songket band -->
  <rect y="0" width="400" height="22" fill="url(#weave)"/>
  <rect y="722" width="400" height="22" fill="url(#weave)"/>

  <!-- house + book mark -->
  <g transform="translate(316 44)">
    <circle cx="32" cy="32" r="34" fill="#f2b632"/>
    <path d="M12 34 L32 16 L52 34" fill="none" stroke="#0f4c45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 31 V50 H46 V31" fill="#f2b632" stroke="#0f4c45" stroke-width="4" stroke-linejoin="round"/>
    <path d="M25 44 q7 -4 7 0 q0 -4 7 0" fill="none" stroke="#0f4c45" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text class="disp" x="26" y="66" fill="#f2b632" font-size="30" font-weight="800" letter-spacing="2">LES PRIVAT</text>
  <text class="disp" x="28" y="108" fill="#ffffff" font-size="38" font-weight="800">Guru Datang</text>
  <text class="disp" x="28" y="148" fill="#ffffff" font-size="38" font-weight="800">ke Rumah</text>
  <path d="M30 160 q60 -10 120 0 t110 -2" fill="none" stroke="#f2b632" stroke-width="4" stroke-linecap="round"/>
  <text x="28" y="190" fill="#cfe5e0" font-size="14">Belajar dengan nyaman di rumah,</text>
  <text x="28" y="209" fill="#cfe5e0" font-size="14">didampingi pengajar berpengalaman.</text>

  <!-- teacher card -->
  <rect x="20" y="230" width="360" height="74" rx="12" fill="#ffffff"/>
  <text x="38" y="258" fill="#4d6661" font-size="11" font-weight="700" letter-spacing="1.5">PENGAJAR</text>
  <rect x="226" y="240" width="140" height="26" rx="13" fill="#0f4c45"/>
  <text x="296" y="258" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Sapaan: <tspan fill="#f2b632" font-weight="800">Bunda Iin</tspan></text>
  <text class="disp" x="38" y="286" fill="#0f4c45" font-size="21" font-weight="800">St. Mutmainah, S.Pd., M.Pd.</text>

  <!-- credentials: tap to expand -->
  <g id="creds"></g>

  <g transform="translate(0 44)">
  <!-- schedule -->
  <text x="28" y="480" fill="#f2b632" font-size="12" font-weight="700" letter-spacing="2">JADWAL</text>
  <g id="days"></g>
  <text x="28" y="540" fill="#ffffff" font-size="14" font-weight="700">☀ Sore hari</text>
  <text x="120" y="540" fill="#cfe5e0" font-size="13">· disesuaikan dengan jadwal siswa</text>

  <!-- area -->
  <rect x="20" y="560" width="360" height="44" rx="22" fill="#f2b632"/>
  <path d="M44 572 c-6 0 -10 4 -10 9 c0 7 10 15 10 15 s10 -8 10 -15 c0 -5 -4 -9 -10 -9z" fill="#0f4c45"/>
  <circle cx="44" cy="581" r="3.3" fill="#f2b632"/>
  <text x="64" y="587" fill="#0f4c45" font-size="15" font-weight="700">Melayani Mataram &amp; sekitarnya</text>

  <!-- contact -->
  <text x="28" y="634" fill="#f2b632" font-size="12" font-weight="700" letter-spacing="2">HUBUNGI</text>
  <text class="disp" x="28" y="660" fill="#ffffff" font-size="20" font-weight="800">WA +62 823-2303-3171</text>
  <text x="372" y="634" fill="#cfe5e0" font-size="12" text-anchor="end">iinmutmainah626@gmail.com</text>
  </g>
</svg>
<p class="hint">Ketuk salah satu baris di atas untuk melihat keterangan lengkap.</p>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sheet-head">
      <span class="sheet-ico" id="sh-ico" aria-hidden="true"></span>
      <h2 id="sh-title"></h2>
      <button class="sheet-x" id="sh-close" type="button" aria-label="Tutup">✕</button>

<section class="panel" aria-labelledby="ph">
  <h2 id="ph">Tanyakan jadwal les</h2>
  <div>
    <p class="lbl">Hari yang diinginkan</p>
    <div class="chips" id="dayChips">
      <button class="chip" id="c-wd" type="button" aria-pressed="true" data-v="Weekday (Senin–Jumat)">Weekday</button>
      <button class="chip" id="c-we" type="button" aria-pressed="false" data-v="Weekend (Sabtu–Minggu)">Weekend</button>

  <div>
    <p class="lbl">Pesan untuk dikirim</p>
    <p class="msg" id="msg"></p>

  <p class="ok" id="ok" aria-live="polite"></p>
  <div class="contact">
    <p class="lbl">Kontak langsung</p>
    <p>WhatsApp: <strong>+62 823-2303-3171</strong><br>Email: <strong>iinmutmainah626@gmail.com</strong></p>
  </div>
</section>

<script>
const NS="http://www.w3.org/2000/svg";
const creds=[
  ["🏆","Pembimbing siswa lolos OSN nasional","",
   "Prestasi membimbing siswa",
   "Selama mengajar di SDIT Abata 2 Lombok, Bunda Iin membimbing siswa dalam persiapan Olimpiade Sains Nasional (OSN) hingga berhasil lolos ke tingkat nasional.",
   ["Pembimbing OSN bagi siswa SDIT Abata 2 Lombok","Siswa bimbingan berhasil lolos ke tingkat nasional","Terbiasa melatih kemampuan bernalar dan pemecahan soal secara tekun"],true],
  ["🎓","Lulusan S2 Manajemen Pendidikan","Magister (M.Pd.) dari UIN Mataram.",
   "Pendidikan",
   "Bunda Iin menyelesaikan pendidikan sarjana (S.Pd.) dan melanjutkan ke jenjang magister pada Program Studi Manajemen Pendidikan, UIN Mataram (M.Pd.).",
   ["S1 Pendidikan, gelar S.Pd.","S2 Manajemen Pendidikan, UIN Mataram, gelar M.Pd.","Bekal untuk menyusun rencana belajar yang terarah dan memantau perkembangan siswa"]],
  ["🏫","Berpengalaman sebagai guru dan wali kelas","Dua tahun di SDIT Abata 2 Lombok.",
   "Pengalaman mengajar di sekolah",
   "Selama dua tahun, Bunda Iin mengajar sekaligus menjabat sebagai wali kelas di SDIT Abata 2 Lombok. Sebagai wali kelas, beliau mendampingi satu kelas secara penuh dan menjadi penghubung antara sekolah dan wali murid.",
   ["Guru di SDIT Abata 2 Lombok selama dua tahun","Wali kelas yang mendampingi siswa setiap hari","Terbiasa berkomunikasi dengan wali murid mengenai perkembangan siswa"]],
  ["📚","Berpengalaman mengajar les privat","Pernah mengajar les privat secara paruh waktu.",
   "Pengalaman les privat",
   "Di luar sekolah, Bunda Iin juga pernah mengajar les privat secara paruh waktu. Pembelajaran satu per satu memungkinkan materi disesuaikan dengan kebutuhan dan kecepatan belajar masing-masing siswa.",
   ["Pernah mengajar les privat paruh waktu","Pendampingan satu guru untuk satu siswa","Pengajar datang ke rumah pada sore hari; jadwal disesuaikan"]]
];
const sheet=document.getElementById("sheet");
let lastFocus=null;
function openSheet(c){
  lastFocus=document.activeElement;
  document.getElementById("sh-ico").textContent=c[0];
  document.getElementById("sh-title").textContent=c[3];
  document.getElementById("sh-body").textContent=c[4];
  const ul=document.getElementById("sh-list");ul.replaceChildren(...c[5].map(t=>{const li=document.createElement("li");li.textContent=t;return li}));
  sheet.hidden=false;document.getElementById("sh-close").focus();
}
function closeSheet(){sheet.hidden=true;lastFocus&&lastFocus.focus()}
document.getElementById("sh-close").addEventListener("click",closeSheet);
sheet.addEventListener("click",e=>{if(e.target===sheet)closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});
function el(t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e}
const g=document.getElementById("creds");
creds.forEach((c,i)=>{
  const y=318+i*44;
  const grp=el("g",{class:"cred",tabindex:"0",role:"button","aria-label":c[1]+". "+c[2]});
  const gold=!!c[6];
  if(gold)grp.classList.add("gold");
  grp.append(el("rect",{class:"bg",x:20,y:y,width:360,height:38,rx:10,fill:gold?"#f2b632":"#14574f"}));
  grp.append(el("text",{x:34,y:y+25,"font-size":16},c[0]));
  const main=el("text",{x:60,y:y+24,fill:gold?"#0f4c45":"#ffffff","font-size":14,"font-weight":800},c[1]);
  const plus=el("text",{x:362,y:y+25,fill:gold?"#0f4c45":"#f2b632","font-size":16,"font-weight":700,"text-anchor":"middle",class:"pulse"},"›");
  grp.append(main,plus);
  const toggle=()=>openSheet(c);
  grp.addEventListener("click",toggle);
  grp.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}});
  g.append(grp);
});
// keep long titles clear of the arrow at x=362
document.fonts.ready.then(()=>g.querySelectorAll(".cred text[font-weight=\"800\"]").forEach(t=>{if(t.getComputedTextLength()>290){t.setAttribute("textLength",290);t.setAttribute("lengthAdjust","spacingAndGlyphs")}}));

const daysG=document.getElementById("days");
const labels=[["Weekday","Sen–Jum"],["Weekend","Sab–Min"]];
const pills=labels.map((d,i)=>{
  const x=28+i*176;
  const r=el("rect",{x:x-8,y:492,width:166,height:30,rx:15,fill:"none",stroke:"#f2b632","stroke-width":1.5});
  const t=el("text",{x:x+75,y:512,"text-anchor":"middle","font-size":13,"font-weight":700,fill:"#f2b632"},d[0]+" · "+d[1]);
  daysG.append(r,t);return [r,t];
});

const chips=[...document.querySelectorAll("#dayChips .chip")];
const kelas=document.getElementById("kelas"),lokasi=document.getElementById("lokasi"),msg=document.getElementById("msg");
function render(){
  chips.forEach((c,i)=>{const on=c.getAttribute("aria-pressed")==="true";pills[i][0].setAttribute("fill",on?"#f2b632":"none");pills[i][1].setAttribute("fill",on?"#0f4c45":"#f2b632")});
  const hari=chips.filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>c.dataset.v);
  msg.textContent=`Assalamu'alaikum Wr. Wb.\nYth. Bunda Iin,\nSaya ingin menanyakan layanan les privat ke rumah untuk anak saya (${kelas.value.trim()||"kelas …"}).\nHari: ${hari.length?hari.join(" atau "):"fleksibel"}, sore hari.\nLokasi: ${lokasi.value.trim()||"…"}.\nApakah masih tersedia jadwal kosong? Terima kasih atas perhatiannya.`;
  document.getElementById("wa").href="https://wa.me/6282323033171?text="+encodeURIComponent(msg.textContent);
}
chips.forEach(c=>c.addEventListener("click",()=>{c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")==="true"?"false":"true");render()}));
kelas.addEventListener("input",render);lokasi.addEventListener("input",render);
document.getElementById("copy").addEventListener("click",()=>{
  const ok=document.getElementById("ok");
  navigator.clipboard.writeText(msg.textContent).then(()=>ok.textContent="Pesan telah disalin. Silakan tempel di WhatsApp untuk mengirimkannya.").catch(()=>{const s=getSelection(),r=document.createRange();r.selectNodeContents(msg);s.removeAllRanges();s.addRange(r);ok.textContent="Teks telah ditandai. Silakan salin secara manual."});
});
render();
</script>
</body>
</html>
